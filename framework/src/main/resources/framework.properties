# ==========================================
# Android Automation Framework Configuration
# ==========================================

# Appium Server
appium.server.url=http://127.0.0.1:4723/
appium.server.timeout.seconds=60

# Android Platform
platform.name=Android
automation.name=UiAutomator2
device.name=Android Device

# IMPORTANT:
# Platform version is intentionally not hardcoded.
# Appium will detect the connected Android device version.
# platform.version=14

# Application
# Package/activity are intentionally not hardcoded here yet.
# We will add the verified app package/activity after Appium
# successfully creates the session.

# Session Lifecycle
no.reset=false
full.reset=false
auto.grant.permissions=true
ignore.hidden.api.policy.error=true

# Appium / ADB Timeouts
new.command.timeout.seconds=300
adb.exec.timeout.ms=60000
uiautomator2.server.install.timeout.ms=120000

# Waits
explicit.wait.seconds=15
implicit.wait.seconds=0
page.load.timeout.seconds=30
polling.every.ms=500

# Reporting
reports.dir=apps/CardManager/reports
screenshots.dir=apps/CardManager/screenshots
screenshot.on.failure=true
screenshot.on.pass=false
attach.screenshot.to.report=true

# Retry
retry.failed.tests=false
max.retry.count=1
